name: Sakhi Sahayak - CI, ECR and Render CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sakhi-render-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "758371668629"
  ECR_SERVER_REPO: sakhi-server
  ECR_IMAGE_URI: 758371668629.dkr.ecr.ap-south-1.amazonaws.com/sakhi-server

jobs:
  verify:
    name: Test, Build Frontend and Validate Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            women-safety-webApp/Server/package-lock.json
            women-safety-webApp/Client/package-lock.json

      - name: Install Backend Dependencies and Run All Tests
        working-directory: women-safety-webApp/Server
        run: |
          npm ci
          node --check index.js
          node --test tests/*.test.js

      - name: Build Frontend for Production
        working-directory: women-safety-webApp/Client
        env:
          VITE_API_BASE_URL: https://sakhi-backend.example.invalid/api
          VITE_SOCKET_URL: https://sakhi-backend.example.invalid
        run: |
          npm ci
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Render-compatible Linux AMD64 Image
        working-directory: women-safety-webApp/Server
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            --tag sakhi-backend:ci .

      - name: Verify Docker HEALTHCHECK Metadata
        run: |
          docker inspect sakhi-backend:ci \
            --format '{{json .Config.Healthcheck}}' | tee healthcheck.json
          grep -q '127.0.0.1:5001/health' healthcheck.json

  publish-ecr:
    name: Publish Immutable Image to Amazon ECR
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_digest: ${{ steps.build.outputs.digest }}
      immutable_image: ${{ steps.immutable.outputs.image }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::758371668629:role/GitHubActionsSakhiRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: sakhi-ecr-${{ github.run_id }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define Image URI
        id: image
        run: echo "image_uri=${ECR_IMAGE_URI}" >> "$GITHUB_OUTPUT"

      - name: Build and Push SHA-tagged Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./women-safety-webApp/Server
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_IMAGE_URI }}:${{ github.sha }}
            ${{ env.ECR_IMAGE_URI }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record Immutable Image Reference
        id: immutable
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMAGE="${IMAGE_URI}@${IMAGE_DIGEST}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Published immutable image: ${IMAGE}"

  deploy-render:
    name: Deploy Exact ECR Digest to Render
    runs-on: ubuntu-latest
    needs: publish-ecr
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      vars.RENDER_DEPLOY_ENABLED == 'true'
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_REGISTRY_CREDENTIAL_ID: ${{ secrets.RENDER_REGISTRY_CREDENTIAL_ID }}
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
      IMAGE_URI: ${{ needs.publish-ecr.outputs.image_uri }}
      IMAGE_DIGEST: ${{ needs.publish-ecr.outputs.image_digest }}

    steps:
      - name: Validate Render Environment Configuration
        run: |
          : "${RENDER_API_KEY:?Missing production secret RENDER_API_KEY}"
          : "${RENDER_SERVICE_ID:?Missing production secret RENDER_SERVICE_ID}"
          : "${RENDER_REGISTRY_CREDENTIAL_ID:?Missing production secret RENDER_REGISTRY_CREDENTIAL_ID}"
          : "${RENDER_SERVICE_URL:?Missing production environment variable RENDER_SERVICE_URL}"

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::758371668629:role/GitHubActionsSakhiRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: sakhi-render-${{ github.run_id }}

      - name: Refresh Render AWS ECR Registry Credential
        env:
          AWS_ACCOUNT_ID: ${{ env.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          set -euo pipefail
          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"
          PAYLOAD="$(jq -n \
            --arg name "Sakhi Sahayak ECR" \
            --arg username "$AWS_ACCOUNT_ID" \
            --arg authToken "$ECR_PASSWORD" \
            '{registry:"AWS_ECR", name:$name, username:$username, authToken:$authToken}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "https://api.render.com/v1/registrycredentials/$RENDER_REGISTRY_CREDENTIAL_ID" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --output "$RUNNER_TEMP/render-credential-response.json"
          echo "Render ECR pull credential refreshed."

      - name: Trigger Render Deployment Using the Published Digest
        id: trigger
        run: |
          set -euo pipefail
          IMAGE_REF="${IMAGE_URI}@${IMAGE_DIGEST}"
          PAYLOAD="$(jq -n --arg imageUrl "$IMAGE_REF" '{imageUrl:$imageUrl}')"
          DEPLOY_REQUESTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          HTTP_CODE="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/render-deploy.json" \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")"
          DEPLOY_ID=""
          if [[ "$HTTP_CODE" == "201" ]]; then
            DEPLOY_ID="$(jq -r '.id // empty' "$RUNNER_TEMP/render-deploy.json")"
          elif [[ "$HTTP_CODE" == "202" ]]; then
            echo "Render queued the deploy behind an active deployment; locating its deploy ID."
            for attempt in $(seq 1 30); do
              curl --fail-with-body --silent --show-error --get \
                "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
                --header "Authorization: Bearer $RENDER_API_KEY" \
                --data-urlencode "createdAfter=$DEPLOY_REQUESTED_AT" \
                --data-urlencode "limit=50" \
                --output "$RUNNER_TEMP/render-deploys.json"
              DEPLOY_ID="$(jq -r --arg image "$IMAGE_REF" --arg since "$DEPLOY_REQUESTED_AT" '
                map(.deploy // .)
                | map(select(.image.ref == $image and (.createdAt // "") >= $since))
                | first
                | .id // empty
              ' "$RUNNER_TEMP/render-deploys.json")"
              [[ -n "$DEPLOY_ID" ]] && break
              sleep 10
            done
          else
            echo "Render deploy request returned HTTP $HTTP_CODE"
            cat "$RUNNER_TEMP/render-deploy.json"
            exit 1
          fi
          test -n "$DEPLOY_ID" || { echo "Render did not return or queue a deploy ID"; exit 1; }
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"
          echo "Render accepted deployment $DEPLOY_ID for $IMAGE_REF"

      - name: Wait for Render Deployment to Become Live
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --output "$RUNNER_TEMP/render-status.json"
            STATUS="$(jq -r '.status // empty' "$RUNNER_TEMP/render-status.json")"
            echo "Render deployment status: ${STATUS:-unknown} (check $attempt/60)"
            if [[ "$STATUS" == "live" ]]; then
              exit 0
            fi
            case "$STATUS" in
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                cat "$RUNNER_TEMP/render-status.json"
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "Timed out waiting for Render deployment to become live."
          cat "$RUNNER_TEMP/render-status.json"
          exit 1

      - name: Verify Public Backend Health Endpoint
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if BODY="$(curl --fail --silent --show-error "$RENDER_SERVICE_URL/health")"; then
              if echo "$BODY" | jq -e '.status == "healthy" and .service == "sakhi-backend"' >/dev/null; then
                echo "Render backend health check passed."
                echo "$BODY" | jq .
                exit 0
              fi
            fi
            echo "Health endpoint not ready yet (check $attempt/20)."
            sleep 10
          done
          echo "Render deployment is live but the application health endpoint failed."
          exit 1
