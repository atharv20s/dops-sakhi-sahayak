name: Sakhi Sahayak - AWS ECR Publish (Manual)

on:
  # Retain only manual execution; disable automated push triggers
  workflow_dispatch:

concurrency:
  group: sakhi-ecr-publish
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_SERVER_REPO: sakhi-server

jobs:
  build-and-publish:
    name: Build & Publish to Amazon ECR
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: women-safety-webApp/Server/package-lock.json

      - name: Run Backend Unit & Integration Tests
        run: |
          cd women-safety-webApp/Server
          npm ci
          node --check index.js
          node --check evidenceRecorder.js
          node --test tests/evidenceRecorder.test.js
          node --test tests/evidenceUpload.integration.test.js

      - name: Build Frontend Assets
        run: |
          cd women-safety-webApp/Client
          npm ci
          npm run build

      # Authenticate via proven AWS IAM OIDC (Zero permanent secrets)
      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::758371668629:role/GitHubActionsSakhiRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: sakhi-deploy-${{ github.run_id }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Tag, and Push Backend Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_SERVER_REPO:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_SERVER_REPO:latest ./women-safety-webApp/Server
          docker push $ECR_REGISTRY/$ECR_SERVER_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_SERVER_REPO:latest

      # Note: ECS Fargate and S3/CloudFront deployments retired.
      # Live frontend hosting is on Vercel; live backend hosting is on Render.
