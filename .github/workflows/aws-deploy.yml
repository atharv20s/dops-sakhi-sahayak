name: Sakhi Sahayak - AWS CI/CD

on:
  workflow_dispatch:
    inputs:
      deployment_mode:
        description: "Choose the workflow execution mode"
        required: true
        type: choice
        default: publish-only
        options:
          - publish-only
          - prepare-ecs

concurrency:
  group: sakhi-cicd-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "758371668629"
  ECR_SERVER_REPO: sakhi-server
  ECS_CLUSTER: sakhi-production-cluster
  ECS_TASK_FAMILY: sakhi-backend-task

jobs:
  build-and-publish:
    name: Test, Build and Publish to ECR
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    outputs:
      image_uri: ${{ steps.image.outputs.image_uri }}
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: women-safety-webApp/Server/package-lock.json

      - name: Install Backend Dependencies and Run Tests
        working-directory: women-safety-webApp/Server
        run: |
          npm ci
          node --check index.js
          node --check evidenceRecorder.js
          node --test tests/health.test.js
          node --test tests/evidenceRecorder.test.js
          node --test tests/evidenceUpload.integration.test.js

      - name: Build Frontend
        working-directory: women-safety-webApp/Client
        run: |
          npm ci
          npm run build

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::758371668629:role/GitHubActionsSakhiRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: sakhi-cicd-${{ github.run_id }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define Image URI
        id: image
        run: |
          echo "image_uri=${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_SERVER_REPO}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Immutable Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./women-safety-webApp/Server
          push: true
          tags: |
            ${{ steps.image.outputs.image_uri }}:${{ github.sha }}
            ${{ steps.image.outputs.image_uri }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Display Published Image
        run: |
          echo "Image URI: ${{ steps.image.outputs.image_uri }}"
          echo "Image digest: ${{ steps.build.outputs.digest }}"
          echo "Immutable image:"
          echo "${{ steps.image.outputs.image_uri }}@${{ steps.build.outputs.digest }}"

  prepare-ecs:
    name: Production Approval and Deployment Preparation
    runs-on: ubuntu-latest

    needs: build-and-publish

    if: >-
      github.ref == 'refs/heads/main' &&
      inputs.deployment_mode == 'prepare-ecs'

    environment:
      name: production

    permissions:
      contents: read

    steps:
      - name: Create Deployment Manifest
        env:
          IMAGE_URI: ${{ needs.build-and-publish.outputs.image_uri }}
          IMAGE_DIGEST: ${{ needs.build-and-publish.outputs.image_digest }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p deployment

          IMAGE="${IMAGE_URI}@${IMAGE_DIGEST}"

          python3 - <<'PY'
          import json
          import os

          manifest = {
              "project": "sakhi-sahayak",
              "commit": os.environ["COMMIT_SHA"],
              "workflow_run_id": os.environ["RUN_ID"],
              "aws_region": "ap-south-1",
              "ecr_image": os.environ["IMAGE_URI"],
              "image_digest": os.environ["IMAGE_DIGEST"],
              "immutable_image": (
                  os.environ["IMAGE_URI"] + "@" + os.environ["IMAGE_DIGEST"]
              ),
              "ecs_cluster": "sakhi-production-cluster",
              "ecs_task_family": "sakhi-backend-task",
              "ecs_service": None,
              "task_definition_registration": "not_performed",
              "ecs_service_deployment": "not_performed",
              "compute_started": False,
              "terraform_remains_source_of_truth": True
          }

          with open("deployment/deployment-manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY

      - name: Upload Deployment Manifest
        uses: actions/upload-artifact@v4
        with:
          name: sakhi-deployment-manifest-${{ github.run_id }}
          path: deployment/deployment-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Explain Deployment Boundary
        run: |
          echo "Deployment preparation completed."
          echo "The immutable image digest is recorded in the artifact."
          echo "No ECS task definition was registered."
          echo "No ECS service was created or updated."
          echo "No ECS task was launched."
          echo "Terraform remains the infrastructure source of truth."
