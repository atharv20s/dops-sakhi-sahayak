name: Sakhi Sahayak - Refresh Render ECR Credential

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

# Credential-only refresh must NOT compete with an active deploy.
# It shares the same production concurrency lock but does not trigger
# its own redeployment — a refreshed ECR token is used at next pull time only.
concurrency:
  group: sakhi-render-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "758371668629"

jobs:
  refresh-credential:
    name: Refresh 12-hour ECR Credential (No Redeploy)
    if: vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_REGISTRY_CREDENTIAL_ID: ${{ secrets.RENDER_REGISTRY_CREDENTIAL_ID }}

    steps:
      - name: Validate Render Environment Configuration
        run: |
          : "${RENDER_API_KEY:?Missing production secret RENDER_API_KEY}"
          : "${RENDER_REGISTRY_CREDENTIAL_ID:?Missing production secret RENDER_REGISTRY_CREDENTIAL_ID}"

      - name: Configure AWS Credentials via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::758371668629:role/GitHubActionsSakhiRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: sakhi-ecr-refresh-${{ github.run_id }}

      - name: Refresh Render AWS ECR Registry Credential
        run: |
          set -euo pipefail
          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"
          PAYLOAD="$(jq -n \
            --arg name "Sakhi Sahayak ECR" \
            --arg username "$AWS_ACCOUNT_ID" \
            --arg authToken "$ECR_PASSWORD" \
            '{registry:"AWS_ECR", name:$name, username:$username, authToken:$authToken}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "https://api.render.com/v1/registrycredentials/$RENDER_REGISTRY_CREDENTIAL_ID" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --output /dev/null
          echo "Render ECR credential refreshed. No redeployment triggered."
          echo "The refreshed token will be used at the next scheduled or code-triggered deploy."
