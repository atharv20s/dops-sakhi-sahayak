name: Sakhi Sahayak - Refresh Render ECR Credential

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

concurrency:
  group: sakhi-render-production
  cancel-in-progress: false

env:
  AWS_REGION: ap-south-1
  AWS_ACCOUNT_ID: "758371668629"
  ECR_IMAGE_URI: 758371668629.dkr.ecr.ap-south-1.amazonaws.com/sakhi-server

jobs:
  refresh-and-redeploy:
    name: Refresh 12-hour ECR Credential and Re-apply Current Digest
    if: vars.RENDER_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_REGISTRY_CREDENTIAL_ID: ${{ secrets.RENDER_REGISTRY_CREDENTIAL_ID }}
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}

    steps:
      - name: Validate Render Environment Configuration
        run: |
          : "${RENDER_API_KEY:?Missing production secret RENDER_API_KEY}"
          : "${RENDER_SERVICE_ID:?Missing production secret RENDER_SERVICE_ID}"
          : "${RENDER_REGISTRY_CREDENTIAL_ID:?Missing production secret RENDER_REGISTRY_CREDENTIAL_ID}"
          : "${RENDER_SERVICE_URL:?Missing production environment variable RENDER_SERVICE_URL}"

      - name: Find the Last Live Immutable ECR Image
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys?limit=20" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --output "$RUNNER_TEMP/render-deploys.json"
          IMAGE_REF="$(jq -r '
            map(.deploy // .)
            | map(select(.status == "live"))
            | sort_by(.createdAt // "")
            | last
            | .image.ref // empty
          ' "$RUNNER_TEMP/render-deploys.json")"
          if [[ -z "$IMAGE_REF" ]]; then
            echo "No live Render deployment exists yet; the first main-branch pipeline must deploy it."
            exit 0
          fi
          if [[ ! "$IMAGE_REF" =~ ^758371668629\.dkr\.ecr\.ap-south-1\.amazonaws\.com/sakhi-server@sha256:[a-f0-9]{64}$ ]]; then
            echo "Latest live Render image is not an immutable Sakhi ECR digest: $IMAGE_REF"
            exit 1
          fi
          echo "IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
          echo "Will refresh credentials and re-deploy the same immutable image."

      - name: Configure AWS Credentials via GitHub OIDC
        if: env.IMAGE_REF != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::758371668629:role/GitHubActionsSakhiRole
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: sakhi-ecr-refresh-${{ github.run_id }}

      - name: Refresh Render AWS ECR Registry Credential
        if: env.IMAGE_REF != ''
        run: |
          set -euo pipefail
          ECR_PASSWORD="$(aws ecr get-login-password --region "$AWS_REGION")"
          PAYLOAD="$(jq -n \
            --arg name "Sakhi Sahayak ECR" \
            --arg username "$AWS_ACCOUNT_ID" \
            --arg authToken "$ECR_PASSWORD" \
            '{registry:"AWS_ECR", name:$name, username:$username, authToken:$authToken}')"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            "https://api.render.com/v1/registrycredentials/$RENDER_REGISTRY_CREDENTIAL_ID" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            --output "$RUNNER_TEMP/render-credential-response.json"
          echo "Render ECR credential refreshed."

      - name: Re-deploy the Same Immutable Image to Apply Refreshed Credential
        if: env.IMAGE_REF != ''
        id: trigger
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n --arg imageUrl "$IMAGE_REF" '{imageUrl:$imageUrl}')"
          DEPLOY_REQUESTED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          HTTP_CODE="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/render-deploy.json" \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")"
          DEPLOY_ID=""
          if [[ "$HTTP_CODE" == "201" ]]; then
            DEPLOY_ID="$(jq -r '.id // empty' "$RUNNER_TEMP/render-deploy.json")"
          elif [[ "$HTTP_CODE" == "202" ]]; then
            echo "Render queued the deploy behind an active deployment; locating its deploy ID."
            for attempt in $(seq 1 30); do
              curl --fail-with-body --silent --show-error --get \
                "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
                --header "Authorization: Bearer $RENDER_API_KEY" \
                --data-urlencode "createdAfter=$DEPLOY_REQUESTED_AT" \
                --data-urlencode "limit=50" \
                --output "$RUNNER_TEMP/render-deploys.json"
              DEPLOY_ID="$(jq -r --arg image "$IMAGE_REF" --arg since "$DEPLOY_REQUESTED_AT" '
                map(.deploy // .)
                | map(select(.image.ref == $image and (.createdAt // "") >= $since))
                | first
                | .id // empty
              ' "$RUNNER_TEMP/render-deploys.json")"
              [[ -n "$DEPLOY_ID" ]] && break
              sleep 10
            done
          else
            echo "Render deploy request returned HTTP $HTTP_CODE"
            cat "$RUNNER_TEMP/render-deploy.json"
            exit 1
          fi
          test -n "$DEPLOY_ID" || { echo "Render did not return or queue a deploy ID"; exit 1; }
          echo "deploy_id=$DEPLOY_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Render and Verify Health
        if: env.IMAGE_REF != ''
        env:
          DEPLOY_ID: ${{ steps.trigger.outputs.deploy_id }}
        run: |
          set -euo pipefail
          LIVE=false
          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --output "$RUNNER_TEMP/render-status.json"
            STATUS="$(jq -r '.status // empty' "$RUNNER_TEMP/render-status.json")"
            echo "Render deployment status: ${STATUS:-unknown} (check $attempt/60)"
            if [[ "$STATUS" == "live" ]]; then LIVE=true; break; fi
            case "$STATUS" in
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                cat "$RUNNER_TEMP/render-status.json"; exit 1 ;;
            esac
            sleep 15
          done
          [[ "$LIVE" == "true" ]] || { echo "Timed out waiting for Render."; exit 1; }
          for attempt in $(seq 1 20); do
            if BODY="$(curl --fail --silent --show-error "$RENDER_SERVICE_URL/health")" &&
               echo "$BODY" | jq -e '.status == "healthy" and .service == "sakhi-backend"' >/dev/null; then
              echo "Render credential refresh and health check completed."
              exit 0
            fi
            sleep 10
          done
          echo "Backend health verification failed after credential refresh."
          exit 1
