name: Sakhi Sahayak - Roll Back Render Backend

on:
  workflow_dispatch:
    inputs:
      deploy_id:
        description: "Previous known-good Render deploy ID"
        required: true
        type: string

concurrency:
  group: sakhi-render-production
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll Back and Verify Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    permissions:
      contents: read
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
      RENDER_SERVICE_URL: ${{ vars.RENDER_SERVICE_URL }}
      TARGET_DEPLOY_ID: ${{ inputs.deploy_id }}

    steps:
      - name: Validate Render Configuration
        run: |
          : "${RENDER_API_KEY:?Missing production secret RENDER_API_KEY}"
          : "${RENDER_SERVICE_ID:?Missing production secret RENDER_SERVICE_ID}"
          : "${RENDER_SERVICE_URL:?Missing production environment variable RENDER_SERVICE_URL}"
          : "${TARGET_DEPLOY_ID:?Provide the previous known-good Render deploy ID}"

      - name: Trigger Render Rollback
        id: rollback
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -n --arg deployId "$TARGET_DEPLOY_ID" '{deployId:$deployId}')"
          HTTP_CODE="$(curl --silent --show-error \
            --output "$RUNNER_TEMP/render-rollback.json" \
            --write-out '%{http_code}' \
            --request POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/rollback" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD")"
          if [[ "$HTTP_CODE" != "201" ]]; then
            echo "Render rollback returned HTTP $HTTP_CODE"
            cat "$RUNNER_TEMP/render-rollback.json"
            exit 1
          fi
          ROLLBACK_ID="$(jq -r '.id // empty' "$RUNNER_TEMP/render-rollback.json")"
          test -n "$ROLLBACK_ID" || { echo "Render did not return a rollback deploy ID"; exit 1; }
          echo "deploy_id=$ROLLBACK_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Rollback and Verify Health
        env:
          DEPLOY_ID: ${{ steps.rollback.outputs.deploy_id }}
        run: |
          set -euo pipefail
          LIVE=false
          for attempt in $(seq 1 60); do
            curl --fail-with-body --silent --show-error \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys/$DEPLOY_ID" \
              --header "Authorization: Bearer $RENDER_API_KEY" \
              --output "$RUNNER_TEMP/render-status.json"
            STATUS="$(jq -r '.status // empty' "$RUNNER_TEMP/render-status.json")"
            echo "Rollback status: ${STATUS:-unknown} (check $attempt/60)"
            if [[ "$STATUS" == "live" ]]; then LIVE=true; break; fi
            case "$STATUS" in
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                cat "$RUNNER_TEMP/render-status.json"; exit 1 ;;
            esac
            sleep 15
          done
          [[ "$LIVE" == "true" ]] || { echo "Timed out waiting for rollback."; exit 1; }
          for attempt in $(seq 1 20); do
            if BODY="$(curl --fail --silent --show-error "$RENDER_SERVICE_URL/health")" &&
               echo "$BODY" | jq -e '.status == "healthy" and .service == "sakhi-backend"' >/dev/null; then
              echo "Render rollback is live and healthy."
              exit 0
            fi
            sleep 10
          done
          echo "Rollback completed but health verification failed."
          exit 1
